services:
  opengrab:
    build: .
    image: opengrab:0.1.0
    container_name: opengrab
    restart: unless-stopped
    ports:
      - "${OPENGRAB_PORT:-5678}:5678"
    environment:
      OPENGRAB_BIND: 0.0.0.0
      OPENGRAB_PORT: 5678
      OPENGRAB_DATA_DIR: /config
      OPENGRAB_DOWNLOAD_DIR: /downloads
      OPENGRAB_BASE_PATH: ${OPENGRAB_BASE_PATH:-}
      OPENGRAB_PAIR_ON_START: ${OPENGRAB_PAIR_ON_START:-1}
      # Plain HTTP from your LAN (the token is still required). Leave at 0 behind
      # an HTTPS reverse proxy and list the proxy in OPENGRAB_TRUSTED_PROXIES.
      OPENGRAB_ALLOW_REMOTE_HTTP: ${OPENGRAB_ALLOW_REMOTE_HTTP:-0}
      OPENGRAB_TRUSTED_PROXIES: ${OPENGRAB_TRUSTED_PROXIES:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ./config:/config
      - ./downloads:/downloads
    security_opt:
      - no-new-privileges:true
