name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python -m pytest -q -rxX
      - name: Build exe
        working-directory: build
        run: python -m PyInstaller --clean --noconfirm --distpath release OpenGrab.spec
      - run: build/release/OpenGrab/OpenGrab.exe --version
      - run: build/release/OpenGrab/OpenGrab.exe --smoke-test
      - name: No ML packages in the base bundle (spec section 2)
        shell: bash
        run: |
          found=$(ls build/release/OpenGrab/_internal | grep -iE '^(onnxruntime|ddddocr|cv2|numpy|torch|tensorflow)' || true)
          if [ -n "$found" ]; then echo "ML packages bundled: $found"; exit 1; fi
          du -sh build/release/OpenGrab
      - name: Build the setup wizard (Inno Setup)
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress | Out-Null   # 6.5+ for the Chinese wizard text
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $ver = python -c "import opengrab; print(opengrab.__version__)"
          & $iscc /Qp "/DAppVersion=$ver" build\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build\release\*.exe | Format-Table Name, Length
      - name: Silent install, run, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem build\release\OpenGrab-*-setup.exe | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\OpenGrabInstall"
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir","/TASKS=magnet,torrent" -Wait
          if (-not (Test-Path "$dir\app\OpenGrab.exe")) { throw "not installed" }
          if (-not (Test-Path "$dir\plugins") -or -not (Test-Path "$dir\models")) { throw "layout" }
          # a windowed exe: wait for it explicitly and read its exit code
          $p = Start-Process "$dir\app\OpenGrab.exe" -ArgumentList "--smoke-test" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "smoke test failed: $($p.ExitCode)" }
          $cmd = (Get-ItemProperty "HKCU:\Software\Classes\magnet\shell\open\command").'(default)'
          if ($cmd -notlike "*OpenGrab.exe*") { throw "magnet handler missing: $cmd" }
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep 3
          if (Test-Path "$dir\app\OpenGrab.exe") { throw "uninstall left the program" }
          if (Test-Path "HKCU:\Software\Classes\magnet\shell\open\command") { throw "uninstall left the magnet handler" }
          "install, smoke test and uninstall OK"
      - uses: actions/upload-artifact@v4
        with:
          name: opengrab-windows
          path: build/release/OpenGrab-*-setup.exe
          retention-days: 14

  # M14: the Python core and web UI on Linux and macOS (headless/Docker use).
  # Windows-only features (registry, DPAPI, tray, WebView2) skip there.
  other-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip install -e .
      - name: Virtual display for the tray library (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a python -m pytest -q -rsxX; else python -m pytest -q -rsxX; fi

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t opengrab:ci .
      - name: Start and wait for the health check
        run: |
          docker run -d --name og -p 5678:5678 -e OPENGRAB_PAIR_ON_START=1 -e OPENGRAB_ALLOW_REMOTE_HTTP=1 opengrab:ci
          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' og)
            echo "health: $state"
            [ "$state" = healthy ] && break
            sleep 3
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' og)" = healthy ] || { docker logs og; exit 1; }
      - name: API answers and needs a token
        run: |
          curl -fsS http://127.0.0.1:5678/api/health
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5678/api/links)
          echo "without token: $code"
          [ "$code" = 401 ] || [ "$code" = 403 ]
          docker logs og 2>&1 | grep -i "pair" || true
      - if: always()
        run: docker logs og || true
