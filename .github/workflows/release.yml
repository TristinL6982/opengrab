name: release
# Push a tag like v0.2.0 (matching opengrab.__version__) to publish a release:
# the portable zip and its Ed25519 signature (for the in-app updater) and
# the setup wizard. Needs the RELEASE_SIGNING_KEY secret (tools/release_key.py).
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip install -e .
      - name: Tag matches the version
        shell: bash
        run: |
          v=$(python -c "import opengrab; print(opengrab.__version__)")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} but version $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - run: python -m pytest -q -rxX
      - name: Build exe
        working-directory: build
        run: python -m PyInstaller --clean --noconfirm --distpath release OpenGrab.spec
      - run: build/release/OpenGrab/OpenGrab.exe --smoke-test
      - name: Portable zip (the updater unpacks its OpenGrab folder)
        shell: pwsh
        run: Compress-Archive -Path build\release\OpenGrab -DestinationPath "build\release\OpenGrab-$env:VERSION-win64.zip"
      - name: Sign the zip
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: python tools/sign_release.py "build/release/OpenGrab-${{ env.VERSION }}-win64.zip"
      - name: Setup wizard
        shell: pwsh
        run: |
          $p = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $p)) { choco install innosetup -y --no-progress | Out-Null }
          & $p /Qp "/DAppVersion=$env:VERSION" build\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --title "OpenGrab $VERSION" --generate-notes \
            "build/release/OpenGrab-$VERSION-win64.zip" \
            "build/release/OpenGrab-$VERSION-win64.zip.sig" \
            "build/release/OpenGrab-$VERSION-setup.exe"
