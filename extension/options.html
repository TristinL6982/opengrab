<!doctype html>
<html>
<head><meta charset="utf-8"><title>OpenGrab extension options</title></head>
<body>
  <h1>OpenGrab</h1>
  <p>Pair this browser in OpenGrab (Settings, Paired devices, Pair new device), then paste the app address and device token here.</p>
  <label>App URL <input id="appUrl" type="url" placeholder="http://127.0.0.1:5678"></label><br>
  <label>Device token <input id="deviceToken" type="password" autocomplete="off"></label><br>
  <button id="save">Save</button> <span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
